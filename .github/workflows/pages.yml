name: Deploy site

# Tests the code, builds the static site (dart run tool/build.dart) and
# publishes build/ to GitHub Pages on every push to main. Built and published
# in two jobs, as GitHub advises: published in the same job, the upload was
# at times not found yet ("No artifacts named github-pages").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; one already running is not cut off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - run: dart run tool/build.dart
      # The source map and deps file are only for debugging; keep the site lean.
      - run: rm -f build/main.dart.js.map build/main.dart.js.deps
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
